<p-button *ngIf="!isExpiring" type="button" size="small" severity="warn" (onClick)="startExpire()" label="Expire"></p-button>
<div *ngIf="isExpiring">
  <div *ngIf="mailer === 'gomail'" class="form-group row">
    <label for="sendmail" class="form-check-label"><b>Send list removal mail </b></label>
    <input id="sendmail" type="checkbox" class="form-check-input" [ngModelOptions]="{ standalone: true }" [(ngModel)]="sendmail" />
  </div>
  <div class="form-group row">
    <p-button severity="secondary" size="small" type="button" styleClass="  btn-xs" (onClick)="cancel()" label="Abort expiration"></p-button>
    <p-button severity="danger" size="small" type="button" styleClass="  btn-xs" (onClick)="confirm()"><i class="fa fa-trash-o"></i>Confirm</p-button>
  </div>
</div>
